# systemd drop-in for the serving unit: `systemctl edit <unit>`, paste, adjust the paths, restart.
# One stream, full 262,144-token window, 4-bit KV, block drafter, loop guard, 48 GiB pinned-RAM prompt cache.
# The box needs the RAM: 48 GiB is pinned at start-up. Lower TF_QWEN27_HOST_CACHE_GIB to fit; unset it and the
# cache falls back to whatever VRAM is left (about one 79K-token prompt at a 131K window, nothing at 262K).
# The binary looks for its kernels in ../share next to bin/ (see RECIPE.md step 2).
[Service]
Environment=TF_QWEN27_KV_BITS=4
Environment=TF_QWEN27_HOST_CACHE_GIB=48
Environment=HF_HOME=/srv/models/huggingface
ExecStart=
ExecStart=/opt/sut-tf/bin/tensorfold-native serve --host 0.0.0.0 --port 8000 --name redops-abliterated --backend cuda --device 0 --parallel 1 --context 262144 --loop-guard --drafter z-lab/Qwen3.8-27B-DFlash2 --no-thinking --no-update-check /srv/models/qwen38-27b-abliterated-4bit
